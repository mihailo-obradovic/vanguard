<!-- * Shown from HTML load until the app mounts — this covers auth-loader's two blocking requests (CSRF cookie + current user), which would otherwise be a blank screen. Pre-i18n, so no text. -->
<div id="boot-splash">
  <div id="boot-splash-spinner" role="progressbar" aria-label="Loading"></div>
</div>
<style>
  /* ! The colours are literals, not the --color-* tokens they mirror: this markup is inlined into the HTML ahead of the stylesheet, and in dev the sheet arrives via JS, so the tokens do not exist yet at paint time. Change a value in assets/styles/main.css, change it here. */
  #boot-splash {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    /* * The page canvas: --background, Dracula's own foreground cream. */
    background: #f8f8f2;
  }

  /* ! Inert on this branch: nothing puts `dark` on <html> yet, so these never match. Kept in step with main.css's own .dark block, which is real and equally unreachable, so the splash is already right when a colour-mode mechanism lands rather than being the one thing left blue. */
  :root.dark #boot-splash {
    background: #21222c;
  }

  #boot-splash-spinner {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    /* * --primary, light: Dracula purple darkened to the step that clears contrast on a light ground. */
    border: 4px solid rgba(129, 68, 197, 0.25);
    border-top-color: #8144c5;
    animation: boot-splash-spin 1.4s linear infinite;
  }

  /* * --primary, dark: Dracula purple as published. */
  :root.dark #boot-splash-spinner {
    border-color: rgba(189, 147, 249, 0.25);
    border-top-color: #bd93f9;
  }

  @keyframes boot-splash-spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>
