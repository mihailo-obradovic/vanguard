trustLockfile: true
engineStrict: true
overrides:
  # CVE-2026-14257: only brace-expansion 5.0.8+ is patched (no 2.x backport)
  brace-expansion: '>=5.0.8'
  # GHSA-g7r4-m6w7-qqqr: esbuild dev-server arbitrary file read (Windows)
  esbuild: '>=0.28.1'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  # * Only msw/node (setupServer) is used; the postinstall exists to place the browser
  # * service-worker script, which nothing here needs.
  msw: false
  unrs-resolver: true
  vue-demi: true
