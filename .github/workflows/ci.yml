name: CI

on:
  push:
    branches: [master, 'variant/**']
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      # * Coverage is measured and printed, not gated — see catalyst/decisions/008
      - run: pnpm test:coverage

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vanguard_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # * pcov: fast line coverage for CI; local runs use the installed Xdebug instead
          coverage: pcov

      - run: composer install --prefer-dist --no-progress

      - run: cp .env.example .env

      - run: php artisan key:generate

      - run: vendor/bin/pint --test

      # * Coverage is measured and printed, not gated — see catalyst/decisions/008
      - run: php artisan test --coverage
